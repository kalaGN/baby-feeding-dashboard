plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.kalagn.babyfeeding'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalagn.babyfeeding'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.1.2'
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Bundle the same dashboard files used by the desktop server.
def bundleBoard = tasks.register('bundleBoard', Sync) {
    from rootProject.file('../dist')
    into layout.buildDirectory.dir('generated/boardAssets/board')
    exclude 'sw.js'
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/boardAssets'))
tasks.named('preBuild').configure { dependsOn bundleBoard }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
