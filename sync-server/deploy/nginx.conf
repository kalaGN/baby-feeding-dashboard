# 启用前先取得域名证书并核对证书路径。
server {
    listen 80;
    server_name babysync.codeainews.top;
    location /.well-known/acme-challenge/ { root /var/lib/baby-feeding-sync/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name babysync.codeainews.top;
    ssl_certificate /etc/letsencrypt/live/babysync.codeainews.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babysync.codeainews.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Apple回调路径不记录查询参数；任何路径均不记录请求正文或Cookie。
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:4180; }
    location / {
        root /opt/baby-feeding-ui;
        try_files $uri $uri/ /index.html;
    }
}
