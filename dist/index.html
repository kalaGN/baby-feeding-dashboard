<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#f5f2e9">
  <meta name="description" content="为平板桌面设计的喝奶时间看板和本机记录工具">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <script>
    try {
      if (localStorage.getItem('milk-board-theme-v1') === 'night') {
        document.documentElement.className = 'night';
        document.getElementById('themeColor').setAttribute('content', '#0e1714');
      }
    } catch (error) { /* Keep the default daytime theme. */ }
  </script>
  <link rel="stylesheet" href="./style.css?v=33">
  <title>喝奶看板</title>
</head>
<body>
  <main class="board">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>喝奶看板</span></div>
      <div class="top-actions">
        <span class="today-date" id="todayDate"></span>
        <button class="icon-button theme-button" id="themeButton" type="button" aria-label="切换夜间模式" aria-pressed="false" title="切换夜间模式">☾</button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="切换全屏" title="切换全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
    </header>

    <section class="main-grid" aria-label="喝奶概况">
      <div class="hero-panel">
        <div class="eyebrow"><span class="live-dot"></span>现在时间</div>
        <div class="clock" id="clock" aria-live="off">--:--</div>
        <div class="hero-rule"></div>
        <div class="hero-bottom">
          <p class="small-label">上次喝奶</p>
          <p class="last-feed" id="lastFeed">还没有记录</p>
          <p class="last-detail" id="lastDetail">记录第一笔后显示奶量</p>
        </div>
      </div>

      <div class="side-column">
        <section class="next-panel" aria-label="下次喝奶时间">
          <div class="next-feed-time" id="nextFeedTime">--:--</div>
          <div class="interval-row"><span>当前间隔</span><button type="button" class="text-button" id="intervalButton"><span id="intervalText">未设置</span><span aria-hidden="true"> ↗</span></button></div>
        </section>
        <section class="today-panel">
          <div class="eyebrow">今日喝奶</div>
          <div class="today-stats">
            <div><strong id="todayTotal">0</strong><span>ml 累计</span></div>
            <div class="stat-divider"></div>
            <div><strong id="todayCount">0</strong><span>次记录</span></div>
          </div>
        </section>
      </div>
    </section>

    <section class="bottom-panel" aria-labelledby="historyHeading">
      <div class="bottom-heading"><h1 id="historyHeading">今日记录</h1><button class="add-button" id="addButton" type="button" aria-label="记录喝奶"><span aria-hidden="true">＋</span></button></div>
      <div class="history" id="history"><p class="empty-history">今天还没有喝奶记录</p></div>
    </section>
    <p id="runtimeStatus" class="runtime-status" role="alert"></p>
    <footer class="footer"><span>记录保存在这台电脑，平板保留同步副本</span><span>为你留住每一次安心的节奏 <span aria-hidden="true">♡</span></span></footer>
  </main>

  <dialog id="feedDialog" class="dialog" aria-label="喝奶记录">
    <form id="feedForm" method="dialog">
      <div class="dialog-heading"><span class="eyebrow" id="feedDialogEyebrow">添加记录</span><button class="close-button" type="button" data-close="feedDialog" aria-label="关闭">×</button></div>
      <label for="amountInput">奶量</label>
      <div class="amount-readout"><output id="amountValue" for="amountInput">120</output><span>ml</span></div>
      <input id="amountInput" name="amount" type="hidden" value="120">
      <div class="amount-wheel-frame">
        <div class="amount-wheel-highlight" aria-hidden="true"></div>
        <div id="amountWheel" class="amount-wheel" role="listbox" tabindex="0" aria-label="奶量，上下滚动选择10至300毫升"></div>
      </div>
      <div class="feed-date-time">
        <div><label for="monthInput">月份</label><select id="monthInput" name="month" required></select></div>
        <div><label for="dayInput">日期</label><select id="dayInput" name="day" required></select></div>
        <div><label for="feedHourInput">小时</label><select id="feedHourInput" name="hour" required></select></div>
        <div><label for="feedMinuteInput">分钟</label><select id="feedMinuteInput" name="minute" required></select></div>
      </div>
      <p class="form-error" id="feedError" role="alert"></p>
      <button class="submit-button" id="feedSubmitButton" type="submit">保存记录</button>
    </form>
  </dialog>

  <dialog id="intervalDialog" class="dialog">
    <form id="intervalForm" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">看板设置</span><h2>两次喝奶间隔</h2></div><button class="close-button" type="button" data-close="intervalDialog" aria-label="关闭">×</button></div>
      <p class="dialog-copy">到预计时间会自动添加一条记录，奶量沿用上一笔；没有上一笔时记 120 ml。</p>
      <div class="amount-readout"><output id="intervalValue">0小时30分钟</output></div>
      <input id="intervalInput" name="interval" type="hidden">
      <div class="interval-wheels">
        <div><label for="intervalHourWheel">小时</label><div class="amount-wheel-frame"><div class="amount-wheel-highlight" aria-hidden="true"></div><div id="intervalHourWheel" class="amount-wheel" role="listbox" tabindex="0" aria-label="间隔小时"></div></div></div>
        <div><label for="intervalMinuteWheel">分钟</label><div class="amount-wheel-frame"><div class="amount-wheel-highlight" aria-hidden="true"></div><div id="intervalMinuteWheel" class="amount-wheel" role="listbox" tabindex="0" aria-label="间隔分钟，每档6分钟"></div></div></div>
      </div>
      <p class="form-error" id="intervalError" role="alert"></p>
      <button class="submit-button" type="submit">保存间隔</button>
    </form>
  </dialog>

  <script>
    (function () {
      function pad(value) { return value < 10 ? '0' + value : String(value); }
      function tick() {
        var now = new Date();
        document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
      }
      tick();
      setInterval(tick, 30000);
      setTimeout(function () {
        if (!window.milkBoardReady) document.getElementById('runtimeStatus').textContent = '记录功能未能启动，请刷新页面或改用 Chrome 浏览器。';
      }, 2000);
    }());
  </script>
  <script src="./app.js?v=33"></script>
</body>
</html>
